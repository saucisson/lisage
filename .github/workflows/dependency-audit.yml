name: dependency-audit

# ADR-0108 (ported from project-template ADR-0008): audit the resolved
# dependency graph when it actually moves - the locked graph rarely
# changes, and the day's CI stays short. A weekly sweep catches
# advisories published for the same lockfile; a human reads the
# scheduled findings either way.
on:
  pull_request:
    paths: ["uv.lock", "pyproject.toml", "Cargo.lock", "Cargo.toml"]
  push:
    branches: [main, daily]
    paths: ["uv.lock", "pyproject.toml", "Cargo.lock", "Cargo.toml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit of the locked graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit of the locked graph
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --strict

  cargo-audit:
    name: cargo audit of the locked graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
