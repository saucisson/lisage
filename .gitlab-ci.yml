# GitLab mirror of the GitHub CI (ADR-0007, ADR-0008).
# Same gates, same order: lint, format, types, layers, tests, security.

stages:
  - check
  - security

default:
  image: ghcr.io/astral-sh/uv:python3.15-bookworm-slim
  before_script:
    - uv sync --locked

quality-gate:
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy tools/notify/src tools/notify/tests scripts
    - uv run lint-imports
    - uv run pytest

rust-quality-gate:
  stage: check
  image: rust:stable-bookworm
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo install cargo-nextest --locked && cargo nextest run --all-targets
    - cargo install cargo-llvm-cov --locked && cargo llvm-cov --all-targets --lcov --output-path lcov.info
    - cargo install cargo-audit --locked && cargo audit
    - cargo install cargo-deny --locked && cargo deny check

# The reviewer agent runs LOCALLY on the developer machine as a headless
# Vibe Code session (ADR-0010), spending the plan's included usage
# instead of pay-per-token API calls - there is no reviewer job here.
# On GitLab, keep "merge when pipeline succeeds" as the merge mechanism.

secret-scan:
  stage: security
  variables:
    GIT_DEPTH: "0"
  script:
    - uvx gitleaks git --no-banner --redact .

dependency-audit:
  stage: security
  script:
    - uv export --locked --format requirements-txt --output-file requirements.txt
    - uvx pip-audit --requirement requirements.txt --strict

cargo-audit:
  stage: security
  image: rust:stable-bookworm
  script:
    - cargo install cargo-audit --locked && cargo audit
