# GitLab mirror of the GitHub CI (ADR-0007, ADR-0008).
# Same gates, same order: fmt, clippy, nextest, coverage, audit, security.

stages:
  - check
  - security

default:
  image: rust:stable-bookworm
  before_script:
    - cargo install cargo-nextest --locked
    - cargo install cargo-llvm-cov --locked
    - cargo install cargo-audit --locked
    - cargo install cargo-deny --locked

quality-gate:
  stage: check
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo nextest run --all-targets
    - cargo llvm-cov --all-targets --lcov --output-path lcov.info
    - cargo audit
    - cargo deny check

# The reviewer agent runs LOCALLY on the developer machine as a headless
# Vibe Code session (ADR-0010), spending the plan's included usage
# instead of pay-per-token API calls - there is no reviewer job here.
# On GitLab, keep "merge when pipeline succeeds" as the merge mechanism.

secret-scan:
  stage: security
  variables:
    GIT_DEPTH: "0"
  script:
    - cargo install gitleaks --locked || true
    - gitleaks git --no-banner --redact .
