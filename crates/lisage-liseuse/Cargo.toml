[package]
name = "lisage-liseuse"
version = "0.1.0"
description = "Le visualiseur (trace, index, rendu SVG/HTML)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lisage-core = { path = "../lisage-core" }
lisage-lang = { path = "../lisage-lang" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
